<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login — ClaimCheck</title>

  <link rel="stylesheet" href="css/login.css">

</head>

<body>

  <main class="login-page">

    <div class="login-card">

      <a href="index.html" class="login-brand">

        <span class="login-brand-mark">✓</span>

        <span class="login-brand-name">
          Claim<span>Check</span>
        </span>

      </a>


      <div class="login-heading">

        <span class="login-eyebrow">
          WELCOME BACK
        </span>

        <h1>Sign in to ClaimCheck</h1>

        <p>
          Verify claims, review evidence, and keep your
          verification history in one place.
        </p>

      </div>


      <form id="loginForm" class="login-form">

        <label for="email">
          Email address
        </label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >


        <label for="password">
          Password
        </label>

        <div class="password-wrap">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            id="togglePassword"
            class="password-toggle"
          >
            Show
          </button>

        </div>


        <div class="login-options">

          <label class="remember-option">

            <input
              type="checkbox"
              id="rememberMe"
            >

            <span>Remember me</span>

          </label>

          <a href="#" id="forgotPassword">
            Forgot password?
          </a>

        </div>


        <button
          type="submit"
          class="login-submit"
        >
          <span>Login</span>
          <span>→</span>
        </button>


        <p
          id="loginMessage"
          class="login-message"
        ></p>

      </form>


      <div class="login-divider">
        <span>Demo Mode</span>
      </div>


      <p class="demo-info">
        This frontend login is a standalone demo.
        No backend connection is used.
      </p>


      <a href="index.html" class="back-home">
        ← Back to ClaimCheck
      </a>

    </div>

  </main>


  <script src="js/login.js"></script>

</body>

</html>
